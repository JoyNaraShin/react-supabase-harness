name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = README 최소 버전. 훅은 Claude Code 가 PATH 의 python3 로 부르므로 하한을 실제로 돌린다.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: doctor (참조·버전·스킬 규격·eval 구조)
        run: python scripts/doctor.py
