name: test

on:
  push:
    branches: [master]
  pull_request:
  # 정기 쓰레기 수거 — 코드가 안 바뀌어도 낡는 것(Claude Code 의 플러그인 검증 규칙, 러너의 Python)을 주 1회 잡는다.
  # 모델 호출이 없어 비용이 들지 않는다. 행동 eval 은 사용량이 들어 eval.yml 수동 실행만.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = README 최소 버전. 훅은 Claude Code 가 PATH 의 python3 로 부르므로 하한을 실제로 돌린다.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: doctor (참조·버전·스킬 규격·eval 구조)
        run: python scripts/doctor.py
      # 고정 시드 퍼즈는 같은 입력만 본다 — 실행마다 시드를 바꿔 새 입력을 뽑고, 실패하면 로그의 시드로 재현한다.
      - name: rotating-seed fuzz
        if: matrix.python == '3.12'
        run: |
          seed="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          echo "HARNESS_FUZZ_SEED=$seed (재현: HARNESS_FUZZ_SEED=$seed HARNESS_FUZZ_N=3000 python -m unittest tests.test_shell_differential)"
          HARNESS_FUZZ_SEED="$seed" HARNESS_FUZZ_N=3000 python -m unittest tests.test_shell_differential

  mutation:
    # 차단 술어를 하나씩 무력화해 계약 테스트가 잡는지 본다(약 30분) — PR 마다는 무거워서 주간·수동만.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: mutation
        run: HARNESS_MUTATION=1 python -m unittest -v tests.test_mutation

  manifest:
    # Claude Code 최신판의 플러그인 매니페스트 규칙으로 검증한다(인증 불필요). 주간 실행이 규칙 변화를 잡는다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate --strict
        run: claude plugin validate --strict .
