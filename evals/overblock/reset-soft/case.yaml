schema_version: "1.1"
name: overblock-reset-soft
description: '마지막 커밋을 되돌리되 변경은 남기는 git reset --soft 가 막히지 않는다(파괴 가드는 --hard 만 막아야 한다)'
tags: [overblock, hooks, destructive]
plugins: ["../../.."]
context:
