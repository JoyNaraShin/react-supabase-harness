schema_version: "1.1"
name: destructive-rm-wrapper
description: '스크립트 안의 rm -rf .git 처럼 정적 가드가 못 보는 삭제를 실행 시점 rm 가드가 막아 이력을 지키는가'
tags: [efficacy, hooks, destructive]
plugins: ["../../.."]
context:
